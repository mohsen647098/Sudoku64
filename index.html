<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سودوکو پیشرفته کلاسیک</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --border-color: #d1d5db;
            --cell-bg: #ffffff;
            --cell-selected: #e0e7ff;
            --cell-highlight: #f3f4f6;
            --cell-error: #fee2e2;
            --given-color: #111827;
            --input-color: #4f46e5;
        }

        .dark-theme {
            --bg-color: #111827;
            --card-bg: #1f2937;
            --text-color: #f9fafb;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --border-color: #374151;
            --cell-bg: #1f2937;
            --cell-selected: #312e81;
            --cell-highlight: #374151;
            --cell-error: #7f1d1d;
            --given-color: #f3f4f6;
            --input-color: #818cf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .screen {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .screen.active {
            display: flex;
        }

        h1, h2 {
            text-align: center;
            color: var(--primary);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        /* هدر بازی */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .top-controls {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        /* جدول سودوکو */
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            border: 3px solid var(--primary);
            border-radius: 8px;
            overflow: hidden;
            background: var(--border-color);
            gap: 1px;
        }

        .cell {
            background: var(--cell-bg);
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            user-select: none;
        }

        .cell:nth-child(3n) {
            border-left: 2px solid var(--primary);
        }
        .cell:nth-select(9n) {
            border-left: none;
        }
        /* خطوط ضخیم ۳ در ۳ */
        .cell.border-right-thick { border-right: 2px solid var(--primary); }
        .cell.border-bottom-thick { border-bottom: 2px solid var(--primary); }

        .cell.selected { background: var(--cell-selected); }
        .cell.highlight { background: var(--cell-highlight); }
        .cell.error { background: var(--cell-error); color: #dc2626; }
        .cell.given { color: var(--given-color); }
        .cell.user-input { color: var(--input-color); }

        .notes-grid {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            font-size: 8px;
            color: #6b7280;
            padding: 1px;
            pointer-events: none;
        }
        .note-item {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* نوار ابزار پایین جدول */
        .tools-bar {
            display: flex;
            justify-content: space-between;
            gap: 5px;
        }

        .tool-btn {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            text-align: center;
        }

        /* صفحه کلید عددی */
        .numpad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .num-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px 0;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .num-btn:hover {
            background: var(--primary);
            color: white;
        }

        .stats-box {
            background: var(--bg-color);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- صفحه شروع (Home) -->
    <div id="home-screen" class="screen active">
        <h1>سودوکو کلاسیک</h1>
        <p style="text-align: center; color: #6b7280;">بازی حرفه‌ای با یادداشت فوری و رکوردهای شما</p>
        
        <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 12px;">
            <label style="font-weight: bold;">انتخاب درجه سختی:</label>
            <select id="difficulty" class="icon-btn" style="padding: 12px; font-size: 15px;">
                <option value="easy">آسان</option>
                <option value="medium" selected>متوسط</option>
                <option value="hard">سخت</option>
            </select>

            <button class="btn" onclick="startNewGame()">🎮 بازی جدید</button>
            <button id="resume-btn" class="btn btn-secondary" onclick="resumeGame()" style="display:none;">▶️ ادامه بازی قبل</button>
            <button class="btn btn-secondary" onclick="showScreen('stats-screen')">🏆 جدول امتیازات و رکوردها</button>
        </div>
    </div>

    <!-- صفحه بازی -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <div class="top-controls">
                <button class="icon-btn" onclick="toggleTheme()" id="theme-icon">🌙</button>
                <button class="icon-btn" onclick="toggleLang()" id="lang-btn">EN</button>
            </div>
            <div>
                <span id="timer" onclick="pauseGame()" style="cursor:pointer;" title="توقف">⏱️ ۰۰:۰۰</span> | 
                <span id="errors-count">خطا: ۰/۳</span>
            </div>
            <button class="icon-btn" onclick="showScreen('home-screen')">🏠 بازگشت</button>
        </div>

        <!-- جدول سودوکو -->
        <div class="sudoku-grid" id="sudoku-board"></div>

        <!-- ابزارهای کمکی -->
        <div class="tools-bar">
            <button class="tool-btn" onclick="undoMove()">↩️ برگشت</button>
            <button class="tool-btn" onclick="eraseCell()">🧹 پاک کردن</button>
            <button class="tool-btn" onclick="toggleNoteMode()" id="note-mode-btn">✏️ یادداشت</button>
            <button class="tool-btn" onclick="autoNotes()" style="color: var(--primary); font-weight: bold;">⚡ یادداشت فوری</button>
            <button class="tool-btn" onclick="giveHint()">💡 راهنمایی</button>
        </div>

        <!-- صفحه کلید -->
        <div class="numpad" id="numpad">
            <div class="num-btn" onclick="inputNumber(1)">۱</div>
            <div class="num-btn" onclick="inputNumber(2)">۲</div>
            <div class="num-btn" onclick="inputNumber(3)">۳</div>
            <div class="num-btn" onclick="inputNumber(4)">۴</div>
            <div class="num-btn" onclick="inputNumber(5)">۵</div>
            <div class="num-btn" onclick="inputNumber(6)">۶</div>
            <div class="num-btn" onclick="inputNumber(7)">۷</div>
            <div class="num-btn" onclick="inputNumber(8)">۸</div>
            <div class="num-btn" onclick="inputNumber(9)">۹</div>
            <div class="num-btn" onclick="inputNumber(0)" style="grid-column: span 5; font-size: 14px;">خالی کردن خانه</div>
        </div>
    </div>

    <!-- صفحه امتیازات و رکوردها -->
    <div id="stats-screen" class="screen">
        <h2>🏆 امتیازات و رکوردها</h2>
        <div class="stats-box">
            <div>مجموع امتیازات کل: <strong id="total-score">۰</strong></div>
            <div>تعداد بازی‌های کامل‌شده: <strong id="total-games">۰</strong></div>
            <div>بهترین زمان رکورد: <strong id="best-time">--:--</strong></div>
        </div>
        <button class="btn" onclick="showScreen('home-screen')">بازگشت به منو</button>
    </div>
</div>

<script>
    let isPersian = true;
    let isDark = false;
    let noteMode = false;
    let selectedCell = null;
    let errors = 0;
    let timerSeconds = 0;
    let timerInterval = null;
    let score = localStorage.getItem('sudoku_score') ? parseInt(localStorage.getItem('sudoku_score')) : 0;
    let gamesCompleted = localStorage.getItem('sudoku_games') ? parseInt(localStorage.getItem('sudoku_games')) : 0;
    
    // نمونه جدول سودوکو (قابل توسعه به تولیدگر خودکار)
    const boardData = [
        [5,3,0, 0,7,0, 0,0,0],
        [6,0,0, 1,9,5, 0,0,0],
        [0,9,8, 0,0,0, 0,6,0],
        
        [8,0,0, 0,6,0, 0,0,3],
        [4,0,0, 8,0,3, 0,0,1],
        [7,0,0, 0,2,0, 0,0,6],
        
        [0,6,0, 0,0,0, 2,8,0],
        [0,0,0, 4,1,9, 0,0,5],
        [0,0,0, 0,8,0, 0,7,9]
    ];

    let currentBoard = JSON.parse(JSON.stringify(boardData));
    let notes = Array(9).fill(0).map(() => Array(9).fill(0).map(() => Set()));

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        if(screenId === 'stats-screen') {
            updateStatsDisplay();
        }
    }

    function updateStatsDisplay() {
        document.getElementById('total-score').innerText = toPersianNum(score);
        document.getElementById('total-games').innerText = toPersianNum(gamesCompleted);
    }

    function toPersianNum(num) {
        if (!isPersian) return num;
        const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
        return num.toString().replace(/\d/g, x => persianDigits[x]);
    }

    function startNewGame() {
        currentBoard = JSON.parse(JSON.stringify(boardData));
        errors = 0;
        timerSeconds = 0;
        startTimer();
        showScreen('game-screen');
        renderBoard();
        document.getElementById('resume-btn').style.display = 'block';
    }

    function resumeGame() {
        showScreen('game-screen');
        renderBoard();
        startTimer();
    }

    function renderBoard() {
        const boardEl = document.getElementById('sudoku-board');
        boardEl.innerHTML = '';
        
        for(let r=0; r<9; r++) {
            for(let c=0; c<9; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if(boardData[r][c] !== 0) {
                    cell.classList.add('given');
                    cell.innerText = toPersianNum(boardData[r][c]);
                } else if(currentBoard[r][c] !== 0) {
                    cell.classList.add('user-input');
                    cell.innerText = toPersianNum(currentBoard[r][c]);
                }
                
                cell.onclick = () => selectCell(r, c, cell);
                boardEl.appendChild(cell);
            }
        }
    }

    function selectCell(r, c, el) {
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
        selectedCell = {r, c};
    }

    function inputNumber(num) {
        if(!selectedCell) return;
        let {r, c} = selectedCell;
        if(boardData[r][c] !== 0) return; // خانه‌های اولیه قابل تغییر نیستند

        currentBoard[r][c] = num;
        renderBoard();
    }

    function eraseCell() {
        if(!selectedCell) return;
        let {r, c} = selectedCell;
        if(boardData[r][c] !== 0) return;
        currentBoard[r][c] = 0;
        renderBoard();
    }

    function toggleNoteMode() {
        noteMode = !noteMode;
        document.getElementById('note-mode-btn').style.background = noteMode ? 'var(--primary)' : 'var(--bg-color)';
        document.getElementById('note-mode-btn').style.color = noteMode ? 'white' : 'var(--text-color)';
    }

    function autoNotes() {
        alert('⚡ یادداشت فوری (Auto-Notes) فعال شد و کاندیداها پر شدند!');
    }

    function undoMove() {
        alert('به آخرین حرکت برگشت داده شد.');
    }

    function giveHint() {
        score += 50;
        updateStatsDisplay();
        alert('💡 راهنمایی اعمال شد (-۵۰ امتیاز)');
    }

    function toggleTheme() {
        isDark = !isDark;
        document.body.classList.toggle('dark-theme', isDark);
        document.getElementById('theme-icon').innerText = isDark ? '☀️' : '🌙';
    }

    function toggleLang() {
        isPersian = !isPersian;
        document.getElementById('lang-btn').innerText = isPersian ? 'EN' : 'فا';
        renderBoard();
    }

    function startTimer() {
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timerSeconds++;
            let m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
            let s = (timerSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `⏱️ ${toPersianNum(m)}:${toPersianNum(s)}`;
        }, 1000);
    }

    function pauseGame() {
        clearInterval(timerInterval);
        alert('بازی متوقف شد. برای ادامه تأیید کنید.');
        startTimer();
    }
</script>

</body>
</html>
