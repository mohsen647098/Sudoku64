name: Build Web App Artifact

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload HTML Package
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-web-package
          path: index.html
